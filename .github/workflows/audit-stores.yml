name: Audit TCG Stores

# Manual trigger only - this is a one-off audit, not the recurring scraper.
# Run it from the Actions tab: Actions -> Audit TCG Stores -> Run workflow
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Run store audit
        run: python audit_stores.py stores.csv audit_report.csv

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.csv
          retention-days: 7
